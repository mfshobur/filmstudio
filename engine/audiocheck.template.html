<!doctype html><meta charset="utf-8"><body><script>
{{MUSIC}}
window.runChunk=async function(b0,b1,BPM,SC){
  var sr=22050,barSec=60/BPM*4,nb=b1-b0+1,dur=nb*barSec+3;
  var c=new OfflineAudioContext(2,Math.floor(sr*dur),sr);
  var comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;var mg=c.createGain();mg.gain.value=.9;comp.connect(mg);mg.connect(c.destination);
  var out=c.createGain();out.gain.value=.42;out.connect(comp);
  var M=createMusic(c,out,BPM,SC);M.cuts={};
  for(var s=(b0-1)*16;s<b1*16;s++)M.step(s,.1+(s-(b0-1)*16)*M.s16);
  var buf=await c.startRendering(),L=buf.getChannelData(0),R=buf.getChannelData(1),barS=Math.floor(sr*barSec),res=[],peak=0,clip=0,nan=0;
  for(var i=0;i<L.length;i++){var a=Math.max(Math.abs(L[i]),Math.abs(R[i]));if(a!==a)nan++;if(a>peak)peak=a;if(a>=.999)clip++}
  for(var k=0;k<nb;k++){var st=Math.floor(sr*.1)+k*barS,sum=0,pk=0;for(var j=st;j<st+barS&&j<L.length;j++){var v=L[j];sum+=v*v;if(Math.abs(v)>pk)pk=Math.abs(v)}res.push([b0+k,+(20*Math.log10(Math.sqrt(sum/barS)+1e-9)).toFixed(1),+(20*Math.log10(pk+1e-9)).toFixed(1)])}
  return {peak:peak,clip:clip,nan:nan,bars:res};
};
</script>
